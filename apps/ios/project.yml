# XcodeGen project definition for the Smart Accelerator iOS client (skeleton).
#
# Spec 91-92, 134; docs/IOS_LIMITATIONS.md; docs/PLATFORM_MATRIX.md §6.
#
# WHY XcodeGen AND NOT A COMMITTED .xcodeproj OR A Package.swift:
#  * a `.pbxproj` is a large generated graph of object IDs; hand-writing one that Xcode
#    accepts (and that truthfully describes an app + app-extension with entitlements,
#    an app group and two Info.plists) is not something anyone can verify by reading it,
#    and this repository does not commit artefacts it cannot stand behind;
#  * SwiftPM cannot express what this target set needs: an `app-extension` product type,
#    the NetworkExtension entitlement on BOTH the app and the extension, an App Group,
#    `NSExtensionPointIdentifier = com.apple.networkextension.packet-tunnel` and the
#    code-signing settings that only exist inside an Xcode project;
#  * XcodeGen keeps the target list and the settings in one *reviewable text file* and
#    generates the project deterministically, so the maintainer can diff a change.
#
# NOTHING HERE HAS BEEN GENERATED, BUILT OR RUN. Xcode does not exist in the environment
# these files were written in, and no Apple Developer account/entitlement is available
# (docs/ACCEPTANCE.md §5.1-§5.3). See README.md for the exact commands and target list.

name: Accelerator
options:
  bundleIdPrefix: club.noclub
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # fill in with the team ID of the paid Apple Developer account
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:

  # ---------------------------------------------------------------------------
  # The app: the SwiftUI UI only. It NEVER talks to the proxy core and never pumps
  # packets; it configures the tunnel and reads shared state (spec 91).
  # ---------------------------------------------------------------------------
  Accelerator:
    type: application
    platform: iOS
    sources:
      - path: Accelerator
      - path: Shared
    info:
      path: Accelerator/Info.plist
    entitlements:
      path: Accelerator/Accelerator.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.noclub.accelerator
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "智能加速"
    dependencies:
      - target: PacketTunnel
        embed: true

  # ---------------------------------------------------------------------------
  # The Network Extension: owns the packet flow, the settings and the core process.
  # It is a SEPARATE PROCESS with a hard memory budget (docs/IOS_LIMITATIONS.md §2).
  # ---------------------------------------------------------------------------
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
        # The extension does NOT include the app-side façade: AcceleratorService owns the
        # product state machine and talks to VpnController (NETunnelProviderManager), which
        # belongs to the app. The extension owns the packet flow and the core instead.
        excludes:
          - "AccelerationService.swift"
    info:
      path: PacketTunnel/Info.plist
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.noclub.accelerator.tunnel
        # The extension's principal class is resolved from the module name.
        INFOPLIST_KEY_NSExtension: ""

schemes:
  Accelerator:
    build:
      targets:
        Accelerator: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
