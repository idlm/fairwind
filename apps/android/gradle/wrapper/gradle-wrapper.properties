# Gradle wrapper properties for the Smart Accelerator Android client (skeleton).
#
# The wrapper JAR is NOT committed: a binary that cannot be generated honestly in this
# environment must not be faked. Run `gradle wrapper --gradle-version <pinned>` once
# with a real JDK to produce gradle/wrapper/gradle-wrapper.jar, then commit the jar
# and this properties file together.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Indicative only - verify against the Android Gradle Plugin's compatibility matrix.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
