# Gradle settings for the Smart Accelerator Android client (skeleton).
#
# spec 88-90, 132. No secrets belong in this file - ever (docs/SECURITY.md).
# Nothing secret is configured here; the bundled proxy core is NOT chosen yet
# (docs/CORE_APPROVAL.md), so there is no clock, no hash and no credential in the build.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Non-transitive R classes keep the resource namespace honest per module.
android.nonTransitiveRClass=true

kotlin.code.style=official

# No signing material here. A release build is BLOCKED without a keystore
# (docs/PLATFORM_MATRIX.md "Signing keystore"); keystores are gitignored.
